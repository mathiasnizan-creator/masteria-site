    * { margin: 0; padding: 0; box-sizing: border-box; }

    .cta {
      display: inline-block; background: #2563EB; color: #fff; text-decoration: none;
      font-weight: 700; font-size: 15px; padding: 13px 28px; border-radius: 10px;
      margin-bottom: 36px;
    }

    .links {
