<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Favicons (logo Masteria, symbole seul — meilleur rendu en favicon Google) -->
    <!-- /favicon.ico en premier : Google le priorise pour la SERP, doit exister à la racine -->
    <link rel="alternate" type="application/rss+xml" title="Veille IA Masteria" href="https://www.master-ia.fr/veille.xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Thème (barre de statut mobile) — site mono-thème clair, on force la cohérence
         pour éviter la bande noire Safari sur overscroll bounce en mode sombre système. -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=yes" />

    <!-- title / description / canonical / og:* / twitter:* entièrement gérés par SEOHead (react-helmet-async) pour éviter les doublons au prerender -->

    <!-- Métadonnées globales non gérées par SEOHead -->
    <meta name="googlebot" content="index, follow" />
    <meta name="author" content="Masteria" />
    <meta name="publisher" content="Masteria" />
    <meta name="geo.region" content="FR-ARA" />
    <meta name="geo.placename" content="Lyon" />

    <!-- title / description / canonical / og:* / twitter:* sont injectés par SEOHead (react-helmet-async) sur chaque route prerenderée -->

    <!-- Préconnexions & chargement non-bloquant des fonts (perf LCP + CLS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <!-- Fonts critiques préchargées en WOFF2 (DM Sans 400 paragraphes + Nunito 900 titres) -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/dmsans/v17/rP2Yp2ywxg089UriI5-g4vlH9VoD8Cmcqbu0-K6z9mXg.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/nunito/v32/XRXV3I6Li01BKofINeaBTMnFcQ.woff2" />
    <!-- Fonts non-bloquantes : variants réduites de 7 à 4 (gain ~50% download) ;
         media="print" swap vers "all" après chargement pour ne pas bloquer le rendu. -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Nunito:wght@800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Nunito:wght@800;900&display=swap" /></noscript>

    <!-- Fallback system fonts size-adjusted (réduit le CLS dû au font-swap) -->
    <style>
      /* Nunito fallback : métriques calibrées pour minimiser le reflowing */
      @font-face {
        font-family: 'Nunito-fallback';
        src: local('Arial Bold'), local('Arial');
        size-adjust: 104%;
        ascent-override: 92%;
        descent-override: 23%;
        line-gap-override: 0%;
      }
      /* DM Sans fallback */
      @font-face {
        font-family: 'DMSans-fallback';
        src: local('Arial'), local('Helvetica Neue'), local('Helvetica');
        size-adjust: 100%;
        ascent-override: 95%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
      html { font-family: 'DM Sans', 'DMSans-fallback', system-ui, -apple-system, Arial, sans-serif; }
      h1, h2, h3 { font-family: 'Nunito', 'Nunito-fallback', system-ui, -apple-system, Arial, sans-serif; }
    </style>
    <!-- Préchargement logo header (WebP servi en priorité par la <picture>, chemin critique LCP) -->
    <link
      rel="preload"
      as="image"
      href="/assets/logo-horizontal@400w.webp"
      type="image/webp"
      imagesizes="(max-width: 768px) 120px, 160px"
      fetchpriority="high"
    />

    <!-- JSON-LD Organization : injecté par SEOHead (react-helmet-async) sur chaque route prérendée.
         Plus de duplication ici pour éviter les conflits d'@id et les valeurs divergentes
         (cf. audit SEO 2026-05-21). Le prerender garantit que chaque HTML servi contient déjà
         le bloc Organization avant exécution JS côté client. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:40px;text-align:center;font-family:sans-serif;">
        Masteria, formation IA en entreprise. Pour afficher ce site, activez JavaScript ou consultez
        <a href="https://www.master-ia.fr">master-ia.fr</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
